name: Read manga list (read-only)

# Runs when run/request.txt changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "run/request.txt"

permissions:
  contents: write

concurrency:
  group: read-list
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANILIST_USER: AlreadyIsekaied
    steps:
      - uses: actions/checkout@v4
      - name: Read the public list through the official AniList API
        run: python3 tools/read_list.py
      - name: Save the summary
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out
          git diff --cached --quiet && exit 0
          git commit -m "Update list summary"
          git pull --rebase
          git push
