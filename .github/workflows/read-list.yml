name: Read manga list (read-only)

# Runs when run/request.txt changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "run/request.txt"

permissions:
  contents: write

concurrency:
  group: read-list
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANILIST_USER: AlreadyIsekaied
    steps:
      - uses: actions/checkout@v4
      - name: Read the public list through the official AniList API
        run: python3 tools/read_list.py
      - name: Encrypt the summary
        if: always()
        run: |
          set +e
          cd out || exit 0
          files=$(ls summary.md completed.txt 2>/dev/null)
          if [ -n "$files" ]; then
            tar -czf ../bundle.tgz $files \
              && openssl rand -hex 32 > ../k.txt \
              && openssl enc -aes-256-cbc -pbkdf2 -salt -in ../bundle.tgz -out bundle.enc -pass file:../k.txt \
              && openssl pkeyutl -encrypt -pubin -inkey ../keys/reader_pub.pem -pkeyopt rsa_padding_mode:oaep -in ../k.txt -out key.enc
          fi
          rm -f summary.md completed.txt ../bundle.tgz ../k.txt
          exit 0
      - name: Save the result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out
          git diff --cached --quiet && exit 0
          git commit -m "Update list summary (encrypted)"
          git pull --rebase
          git push
